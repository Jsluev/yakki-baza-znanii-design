function renderGlossary(){
  buildNav('glossary');
  const sorted = [...GLOSSARY].sort((a,b)=>a.term.localeCompare(b.term,'ru'));
  const letters = [...new Set(sorted.map(t=>t.term[0].toUpperCase()))];
  const allLetters = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЭЮЯ'.split('');
  function scrollToLetter(l){
    if(letters.includes(l)){
      const el = document.getElementById('g-'+l);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    } else {
      const idx = allLetters.indexOf(l);
      for(let i=idx+1;i<allLetters.length;i++){
        if(letters.includes(allLetters[i])){
          const el = document.getElementById('g-'+allLetters[i]);
          if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
          return;
        }
      }
      for(let i=idx-1;i>=0;i--){
        if(letters.includes(allLetters[i])){
          const el = document.getElementById('g-'+allLetters[i]);
          if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
          return;
        }
      }
    }
  }
  let html = `<div class="wrap fade-in">
    <div class="crumbs"><a href="#/">ЯККИ</a><span class="sep">/</span><span>Глоссарий</span></div>
    <div class="catalog-head">
      <h1 style="margin-top:0;">Словарь терминов</h1>
      <p>Простые, неакадемические определения — с перекрёстными ссылками на методологию.</p>
    </div>
    <div class="alpha-nav">${allLetters.map(l=>`<a class="${letters.includes(l)?'has':''}" onclick="event.preventDefault();scrollToLetter('${l}')" href="#">${l}</a>`).join('')}</div>
    <div style="max-width:760px;">`;
  let lastLetter='';
  sorted.forEach(t=>{
    const L = t.term[0].toUpperCase();
    if(L!==lastLetter){ html+=`<div class="gloss-letter" id="g-${L}">${L}</div>`; lastLetter=L; }
    html += `<a class="gloss-row" data-nav="#/glossary/${encodeURIComponent(t.term)}" style="text-decoration:none;color:inherit;">
      <span class="term">${t.term}</span><span class="def">${t.def}</span>
    </a>`;
  });
  html += `</div></div>`;
  document.getElementById('app').innerHTML = html;
  window.scrollToLetter = scrollToLetter;
}

function goToResultsForValue(valId){
  state.resultsSel = {approach:null, area:null, value:valId};
  if(location.hash === '#/results' || location.hash.indexOf('#/results?')===0) renderResults();
  else location.hash = '#/results';
}
function exportValueForAI(vid){
  const v = byId(VALUES, vid) || {id:vid};
  const cases = CASES.filter(c=>c.values&&c.values.includes(vid)).map(c=>({id:c.id,title:c.title}));
  const tools = TOOLS.filter(t=>t.values&&t.values.includes(vid)).map(t=>({id:t.id,title:t.title}));
  let results = [];
  RESULTS_TREE.forEach(appr=>appr.influenceAreas.forEach(area=>area.results.forEach(r=>{
    if(r.values&&r.values.includes(vid)) results.push({id:r.id, text:r.title||r.text, approach:appr.approach, area:area.name});
  })));
  const payload = {value:v, results, cases, tools};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'yakki-value-' + vid + '.json'; a.click();
  URL.revokeObjectURL(url);
}

function valueResultIds(vid){
  const rows=[]; const seen=new Set();
  const ordered=((byId(VALUES,vid)||{}).keyResults)||[];
  ordered.forEach(rid=>{ if(RESULT_POS[rid]&&!seen.has(rid)){ seen.add(rid); rows.push(rid); }});
  RESULTS_TREE.forEach(a=>a.influenceAreas.forEach(ar=>ar.results.forEach(r=>{
    if(r.values&&r.values.includes(vid)&&!seen.has(r.id)){ seen.add(r.id); rows.push(r.id); }
  })));
  return rows;
}

            }).join('')
          : area.results.map((r,ri)=>{
          const valNames = (r.values||[]).map(vid=>{const v=VALUES.find(x=>x.id===vid);return v?v.title:'';}).filter(Boolean).join(', ');
          return `<a class="result-line" href="#/result/${selA}/${selI}/${ri}" style="text-decoration:none;color:inherit;cursor:pointer;transition:background .15s;" onmouseover="this.style.background='var(--paper-raised)'" onmouseout="this.style.background=''">${r.title||r.text}${valNames?`<span class="ind" style="font-size:14px;color:var(--ink-faint);margin-top:2px;">♦ ${valNames}</span>`:''}</a>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}
function selResultsApproach(i){ state.resultsSel={approach:i, area:null, value:null}; renderResults(); }
function selResultsArea(i){ state.resultsSel.area=i; renderResults(); }
function selResultsValue(vid){ state.resultsSel.value=vid; renderResults(); }

function exportResultsForAI(){
  const data = JSON.stringify(RESULTS_TREE, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'yakki-results-bank.json'; a.click();
  URL.revokeObjectURL(url);
}

/* ============================================================
   РЕНДЕР: ПОИСК
   ============================================================ */
function renderSearch(q, type){
  buildNav(null);
  q = q||''; type = type||'all';
  const qLower = q.toLowerCase();

  const TYPE_ALIASES = {
    'кейс': 'cases', 'кейсы': 'cases', 'кейсов': 'cases', 'проект': 'cases', 'проекты': 'cases',
    'инструмент': 'tools', 'инструменты': 'tools', 'анкета': 'tools', 'анкеты': 'tools', 'гайд': 'tools', 'чек-лист': 'tools',
    'методолог': 'methodology', 'методология': 'methodology', 'подход': 'methodology', 'критерии': 'methodology',
    'шаблон': 'templates', 'шаблоны': 'templates', 'документ': 'templates',
    'глоссарий': 'glossary', 'термин': 'glossary', 'определение': 'glossary',
    'ценность': 'values', 'ценности': 'values',
    'результат': 'results', 'результаты': 'results',
    'faq': 'faq', 'вопрос': 'faq', 'ответ': 'faq'
  };

  let resolvedType = type;
  if(type === 'all' && q) {
    const words = qLower.split(/\s+/);
    for(const w of words) {
      if(TYPE_ALIASES[w]) { resolvedType = TYPE_ALIASES[w]; break; }
    }
  }

  function match(text){ return !q || text.toLowerCase().includes(qLower); }

  let results = [];
  CASES.forEach(c=>{ if(match(c.title+c.shortDesc+c.org+c.projectType+c.tags.join(' '))) results.push({type:'cases', obj:c, route:'case'}); });
  TOOLS.forEach(t=>{ if(match(t.title+t.shortDesc+t.type+t.audience)) results.push({type:'tools', obj:t, route:'tool'}); });
  GLOSSARY.forEach(g=>{ if(match(g.term+g.def)) results.push({type:'glossary', obj:{title:g.term, shortDesc:g.def, id:g.term}, route:'glossary'}); });
  VALUES.forEach(v=>{ if(match(v.title+v.desc)) results.push({type:'values', obj:{title:v.title, shortDesc:v.desc, id:v.id}, route:'value'}); });
  RESULTS_TREE.forEach((appr,ai)=>{ appr.influenceAreas.forEach((area,ari)=>{ area.results.forEach((r,ri)=>{
    if(match(r.text+' '+appr.approach+' '+area.name)) results.push({type:'results', obj:{title:r.text, shortDesc:appr.approach+' → '+area.name}, ai, ari, ri});
  }); }); });

  if(resolvedType!=='all') results = results.filter(r=>r.type===resolvedType);

  const tabs = ['all','cases','tools','values','results','glossary'];
  document.getElementById('app').innerHTML = `<div class="wrap fade-in">
    <div class="crumbs"><a href="#/">ЯККИ</a><span class="sep">/</span><span>Поиск</span></div>
    <div class="catalog-head">
      <h1 style="font-size:26px;">Результаты поиска${q?': «'+esc(q)+'»':''}</h1>
      <p style="font-size:13px;color:var(--ink-soft);max-width:640px;">Область поиска — вся база знаний: материалы, ценности, результаты, справочник. Поиск по всему сайту — в шапке основного сайта. Внутри разделов (кейсы, инструменты и т. п.) работает свой локальный поиск.</p>
      <div class="unisearch" style="margin-top:18px;max-width:640px;">
        <div class="unisearch-main">
          <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>
          <input id="searchPageInput" value="${esc(q)}" placeholder="Найти кейс, инструмент, шаблон или термин…" onkeydown="if(event.key==='Enter')searchPageGo()">
          <button onclick="searchPageGo()">Найти</button>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 22px;">
      ${tabs.map(t=>`<a class="chip ${resolvedType===t?'active':''}" data-nav="#/search?q=${encodeURIComponent(q)}&type=${t}">${t==='all'?'Все':SECTIONS[t].short}</a>`).join('')}
    </div>
    <div class="count" style="margin-bottom:14px;color:var(--ink-soft);font-size:13px;">Найдено: ${results.length}</div>
    <div class="search-results card-list">
      ${results.length ? results.map(r=>{
        const s = SECTIONS[r.type];
        const badge = `<span class="type-badge" style="background:${s.pill};">${s.badge}</span>`;
        if(r.type==='results') return `<a class="item-card" data-nav="#/result/${r.ai}/${r.ari}/${r.ri}" style="text-decoration:none;">
          <div class="card-body">
            <div class="card-topline">${badge}</div>
            <div class="card-head"><h3>${r.obj.title}</h3></div>
            <div class="desc">${r.obj.shortDesc}</div>
          </div>
        </a>`;
        if(r.type==='values') return `<a class="item-card" data-nav="#/value/${r.obj.id}" style="text-decoration:none;">
          <div class="card-body">
            <div class="card-topline">${badge}</div>
            <div class="card-head"><h3>${r.obj.title}</h3></div>
            <div class="desc">${r.obj.shortDesc}</div>
          </div>
        </a>`;
        const routeKey = r.type==='cases'?'case':r.type==='tools'?'tool':r.type;
        return `<a class="item-card" data-nav="#/card/${routeKey}/${encodeURIComponent(r.obj.id||r.obj.title)}" style="text-decoration:none;">
          <div class="card-body">
            <div class="card-topline">${badge}</div>
            <div class="card-head"><h3>${r.obj.title}</h3></div>
            <div class="desc">${r.obj.shortDesc}</div>
          </div>
        </a>`;
      }).join('') : `<div class="empty-state"><h3>Ничего не найдено</h3><p>Попробуйте другой запрос или снимите фильтр по типу материала.</p></div>`}
    </div>
  </div>`;
}
function searchPageGo(){
  const v = document.getElementById('searchPageInput').value.trim();
  if(!v){go('#/search');return;}
  go('#/search?q='+encodeURIComponent(v));
}

/* ============================================================
   ГЛАВНЫЙ РОУТЕР
   ============================================================ */
/* Глобальные обработчики для инлайн-хендлеров (обязаны быть вне render()) */
function showPromptPreview(key){
  const item = PROMPTS.find(p=>p.key===key);
  if(!item) return;
  const el = document.getElementById('prompt-preview-'+key);
  if(!el) return;
  if(el.style.display==='none'){
    el.textContent = item.prompt;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}
function toggleCollapsible(btn){
  const block = btn.closest('.collapsible');
  if(!block) return;
  block.classList.toggle('open');
}
function render(){
  const {parts, query} = parseHash();
  window.scrollTo(0,0);
  document.body.className = pageClass(parts);
/* ============================================================
   РЕНДЕР: ПРОМТЫ ДЛЯ ИИ
   ============================================================ */
function renderPrompts(){
  buildNav('prompts');
  const cats = [...new Set(PROMPTS.map(p=>p.cat))];
  document.getElementById('app').innerHTML = `
  <div class="wrap fade-in">
    <div class="crumbs"><a href="#/">ЯККИ</a><span class="sep">/</span><span>Промты для ИИ</span></div>
    <div class="catalog-head">
      <h1 style="margin-top:0;">Промты для AI-агентов</h1>
      <p>Готовые инструкции для AI-ассистентов, созданные на основе методологии оценки культурных проектов из базы знаний ЯККИ. Скопируйте промт и используйте в любом AI-инструменте.</p>
    </div>
    <div style="max-width:760px;margin-top:26px;">
      ${cats.map(cat => `
        <div style="margin-bottom:28px;">
          <h3 style="font-size:16px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line);">${cat}</h3>
          ${PROMPTS.filter(p=>p.cat===cat).map(p => `
            <div style="background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:10px;">
              <div style="font-weight:700;font-size:14px;margin-bottom:4px;">${p.title}</div>
              <div style="font-size:13px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px;">${p.desc}</div>
              ${p.prompt ? `
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button class="btn btn-primary btn-sm" onclick="copyPrompt('${p.key}')">Скопировать промт</button>
                  <button class="btn btn-ghost btn-sm" onclick="showPromptPreview('${p.key}')">Показать промт</button>
                </div>
                <div id="prompt-preview-${p.key}" style="display:none;margin-top:12px;background:var(--paper-sunk);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:12.5px;line-height:1.6;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink-soft);max-height:300px;overflow-y:auto;"></div>
              ` : `
                <button class="btn btn-primary btn-sm" onclick="exportJSON()">Скачать JSON базы знаний</button>
              `}
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>
    <div class="audience-note" style="margin-top:20px;max-width:640px;">Промты используют структуру и терминологию из <a data-nav="#/glossary" style="text-decoration:underline">глоссария</a> и <a data-nav="#/section/methodology" style="text-decoration:underline">методологии</a> ЯККИ. Для лучшего результата дополняйте промт конкретными данными вашего проекта.</div>
  </div>`;
}
/* ============================================================
   РЕНДЕР: СТРАНИЦА РЕЗУЛЬТАТА
   ============================================================ */
function renderResultDetail(apprIdx,areaIdx,resultIdx){
  buildNav('results');
  const appr = RESULTS_TREE[apprIdx];
  if(!appr){ document.getElementById('app').innerHTML = notFound(); return; }
  const area = appr.influenceAreas[areaIdx];
  if(!area){ document.getElementById('app').innerHTML = notFound(); return; }
  const result = area.results[resultIdx];
  if(!result){ document.getElementById('app').innerHTML = notFound(); return; }

  const valNames = (result.values||[]).map(vid=>valuePillHtml(vid)).filter(Boolean);
  const keyCaseIds = (result.keyCases&&result.keyCases.length) ? result.keyCases : [];
  const keyToolIds = (result.keyTools&&result.keyTools.length) ? result.keyTools : [];
  const relatedCases = keyCaseIds.map(cid=>byId(CASES,cid)).filter(Boolean);
  const relatedTools = keyToolIds.map(tid=>byId(TOOLS,tid)).filter(Boolean);
  const resultText = result.title || result.text;
  const otherList = (result.otherFormulations&&result.otherFormulations.length)
    ? result.otherFormulations
    : area.results.filter((r,i)=>i!==resultIdx).slice(0,5).map(r=>r.text);

  document.getElementById('app').innerHTML = `<div class="wrap wrap-narrow fade-in pg-result">
    <div class="crumbs"><a href="#/">ЯККИ</a><span class="sep">/</span><a href="#/results">Банк результатов</a><span class="sep">/</span><span>${resultText}</span></div>
    ${detailHero({pill:SECTIONS.results.pill,badge:'Результат',topExtra:'',title:resultText,lead:result.text!==result.title?result.text:'',cta:`<button class="btn btn-primary" onclick="exportResultsForAI()">Скачать для ИИ</button>`,meta:'',tint:'#2E7FC2',grad:'linear-gradient(100deg,#0A2463 0%,#224A8A 40%,#3668AA 70%,#5597DB 100%)',titleSize:'clamp(34px,4vw,48px)'})}
    <div class="detail-grid case-grid">
      <div>
        <div class="block"><h2>Характеристика результата</h2>
          <dl class="kv">
            <dt>ID</dt><dd>${result.id}</dd>
            <dt>Подход</dt><dd>${appr.approach}</dd>
            <dt>Область влияния</dt><dd>${area.name}</dd>
            <dt>Название</dt><dd>${result.title||result.text}</dd>
            <dt>Общая формулировка</dt><dd>${result.text}</dd>
            ${valNames.length?`<dt>Ценности</dt><dd>${`<div class="chip-row">${valNames.join('')}</div>`}</dd>`:''}
          </dl>
        </div>
        ${otherList.length ? `<div class="block" style="margin-top:16px;">
          <h2>Другие формулировки (${otherList.length})</h2>
          <div>
            ${otherList.map(txt=>{
              if(result.otherFormulations&&result.otherFormulations.length) return `<div style="display:block;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;">${txt}</div>`;
              return `<a href="#/result/${apprIdx}/${areaIdx}/${area.results.findIndex(x=>x.text===txt)}" style="display:block;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;text-decoration:none;">${txt}</a>`;
            }).join('')}
          </div>
        </div>` : ''}
        ${result.indicators&&result.indicators.length ? `<div class="block" style="margin-top:16px;">
          <h2>Показатели (${result.indicators.length})</h2>
          <ul style="font-size:14.5px;line-height:1.7;color:var(--ink-soft);padding-left:18px;margin:0;">
            ${result.indicators.map(ind=>`<li>${ind}</li>`).join('')}
          </ul>
        </div>` : ''}
        ${relatedCollectionHtml('Ключевые кейсы', relatedCases.slice(0,5), 'cases', 'Все кейсы', '#/section/cases?q='+encodeURIComponent(resultText))}
        ${relatedCollectionHtml('Ключевые инструменты', relatedTools.slice(0,5), 'tools', 'Все инструменты', '#/section/tools?q='+encodeURIComponent(resultText))}
      </div>
      <div>
        ${sidebarNavBox([
          {label:'Банк результатов', href:'#/results', prefix:'← '},
          {label:'Все кейсы', href:'#/section/cases', prefix:'→ '},
          {label:'Все инструменты', href:'#/section/tools', prefix:'→ '},
          {label:'Все материалы', href:'#/section/all', prefix:'→ '}
        ])}
      </div>
    </div>
  </div>`;
}

function pageClass(parts){
  const a = parts[0]||'', b = parts[1]||'';
  if(!a) return 'pg-home';
  if(a==='section' && b==='all') return 'pg-all';
  if(a==='section' && b==='cases') return 'pg-cases';
  if(a==='section' && b==='tools') return 'pg-tools';
  if(a==='section' && b==='methodology') return 'pg-methodology';
  if(a==='section' && b==='templates') return 'pg-templates';
  if(a==='values' || a==='value') return 'pg-values';
  if(a==='results') return 'pg-results';
  if(a==='result') return 'pg-result';
  if(a==='card' && b==='case') return 'pg-case';
  return '';
}
  if(parts.length===0){ location.hash='#/section/all'; return; }
  const [a,b,c] = parts;
  if(a==='start'||a==='faq'||a==='glossary'){ location.hash='#/section/all'; return; }
  if(a==='section' && (b==='methodology'||b==='templates')){ location.hash='#/section/all'; return; }
  if(a==='section' && (b==='all' || CATALOG_SECTIONS.includes(b))) return renderSection(b);
  if(a==='card'){
    if(b==='case') return renderCaseDetail(c);
    if(b==='tool') return renderToolDetail(c);
    if(b==='methodology'||b==='template'){ location.hash='#/section/all'; return; }
    if(b==='value') return renderValueDetail(c);
    if(b==='glossary') return renderGlossaryTerm(decodeURIComponent(c));
  }
  if(a==='glossary'){ return b? renderGlossaryTerm(decodeURIComponent(b)) : renderGlossary(); }
  if(a==='values'){ return renderValues(); }
  if(a==='value'){ return renderValueDetail(b); }
  if(a==='results'){ return renderResults(); }
  if(a==='result'){ return renderResultDetail(parseInt(b),parseInt(c),parseInt(parts[3]||'0')); }
  if(a==='faq'){ return renderFAQ(); }
  if(a==='prompts'){ return renderPrompts(); }
  if(a==='search'){ return renderSearch(query.q, query.type); }
  location.hash='#/section/all';
}
</script>
